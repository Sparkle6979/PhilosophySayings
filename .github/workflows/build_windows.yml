name: Build Windows Release

# 1. 触发条件 (Triggers)
on:
  # 当我们手动点击 GitHub 网页上的 "Run workflow" 按钮时触发
  workflow_dispatch:
  
  # 当有人推送带有 "v" 开头的 Tag 时自动触发 (例如 v1.0.0, v1.1.2)
  push:
    tags:
      - 'v*'

# 2. 任务矩阵 (Jobs)
jobs:
  build:
    # 这是最核心的一步：告诉 GitHub 租用一台最新版的 Windows 虚拟机来跑我们的代码
    runs-on: windows-latest
    
    steps:
      # 步骤 1: 把存在 GitHub 上的源码下载（Checkout）到这台 Windows 原生服务器上
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # 步骤 2: 在这台光秃秃的 Windows 服务器上，装好最新的 Flutter 稳定版环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # 步骤 3: 运行 pub get 下载项目依赖的所有第三方包 (类似 npm install)
      - name: Install dependencies
        run: flutter pub get
        
      # 步骤 4: 开始真正的编译。这会在跑完后生成 build\windows\x64\runner\Release 文件夹
      - name: Build Windows desktop
        run: flutter build windows --release
        
      # 步骤 5: 将编译出来的碎文件打包成一个 .zip 压缩包，方便用户整体下载解压使用
      - name: Compress build output
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath PhilosophySayings-Windows.zip
        
      # 步骤 5.5: 提供构建产物下载 (即使不是正式发版，也能在 Actions 页面下载体验)
      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhilosophySayings-Windows
          path: PhilosophySayings-Windows.zip

      # 步骤 6 (发版专属): 把打包好的 zip 文件上传到带有 v 标签的 Release 页面里！
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: PhilosophySayings-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
